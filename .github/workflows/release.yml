name: Publicar sistema para instalação por manifesto
on:
  push:
    branches: [main]
    paths: [system.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-system-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: python tools/package.py --release
      - name: Publicar release com manifesto e ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./system.json').version")
          ID=$(node -p "require('./system.json').id")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "A versão v${VERSION} já existe; os arquivos publicados não serão alterados."
            exit 0
          fi
          gh release create "v${VERSION}" "dist/system.json" "dist/${ID}-${VERSION}.zip" \
            --latest --target "$GITHUB_SHA" --title "Fichas v${VERSION}" \
            --notes-file docs/notas-release.md
